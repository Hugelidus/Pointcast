<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pointcast store screenshot 1: record and point</title>
<link rel="stylesheet" href="store.css">
<style>
  .browser { left: 56px; top: 176px; width: 816px; }
  /* The captures are 1120x780 CSS px at 2x. */
  .page { width: 816px; height: 568.3px; }

  /* raw/popup-rec-export.png is 260x427 CSS px, shown at 1.2x. */
  .popup { left: 866px; top: 218px; width: 312px; }
  .popup img { width: 312px; }

  /* What the user says while pointing: the narration of the recording. */
  .speech {
    position: absolute;
    left: 551px;
    top: 410px;
    width: 298px;
    padding: 12px 16px 14px;
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 16px 40px rgba(18, 15, 45, 0.28), 0 0 0 1px rgba(124, 58, 237, 0.25);
  }
  .speech::after {
    /* The tail, toward the Export button. */
    content: "";
    position: absolute;
    right: 34px;
    bottom: -9px;
    width: 18px;
    height: 18px;
    background: #fff;
    transform: rotate(45deg);
    box-shadow: 4px 4px 8px rgba(18, 15, 45, 0.08);
  }
  .speech .who {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--violet);
  }
  .speech q { display: block; margin-top: 6px; font-size: 15px; line-height: 1.4; font-weight: 500; quotes: "\201C" "\201D"; }

  /* Where the Alt+click landed (screenshots never include the mouse pointer). */
  .cursor { position: absolute; left: 810px; top: 578px; width: 20px; height: 28px; }

  /* The REC pill, 2x, next to where it is in the page. */
  .rec-card {
    position: absolute;
    left: 904px;
    top: 741px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .rec-card .zoom {
    width: 114px;
    height: 50px;
    border-radius: 25px;
    background-image: url("raw/rec-export.png");
    background-position: -2102px -1486px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  .rec-card span { font-size: 14px; line-height: 1.35; color: var(--soft); font-weight: 500; }
  .link { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
  <div class="header">
    <span class="step">1 · Record</span>
    <h1 class="headline">Talk and <em>Alt+click</em> what you mean</h1>
    <p class="subline">Narrate the change while you point at it. The click never reaches your app.</p>
  </div>
  <!-- LOGO: scripts/icon/pointcast.svg -->
  <div class="brand"><img src="../../../../scripts/icon/pointcast.svg" alt=""><span>pointcast</span></div>

  <div class="browser">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#7a7596" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4M8 4.8v.1" stroke-linecap="round"/></svg>
        127.0.0.1:5174
      </div>
      <div class="ext active"><img src="../../../../scripts/icon/pointcast.svg" alt=""></div>
    </div>
    <!-- Real capture: the e2e build recording on examples/react-dashboard, right after the
         Alt+click on «Export» (the red outline is pointcast's capture flash; REC bottom right). -->
    <img class="page" src="raw/rec-export.png" alt="">
  </div>

  <div class="speech">
    <div class="who">
      <svg width="12" height="14" viewBox="0 0 12 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="1" width="6" height="9" rx="3"/><path d="M1 8a5 5 0 0 0 10 0M6 13v2"/></svg>
      You say
    </div>
    <q id="quote">And this button should export the order status as well as the list.</q>
  </div>

  <svg class="cursor" viewBox="0 0 20 28" aria-hidden="true">
    <path d="M1.5 1.5v21l5.2-5 3.6 8.3 3.6-1.6-3.6-8.1h7.2z" fill="#fff" stroke="#120f2d" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>

  <!-- Real capture: the popup (popup.html) reporting on the app's tab during that recording. -->
  <div class="popup"><img src="raw/popup-rec-export.png" alt=""></div>

  <svg class="link" width="1280" height="800" aria-hidden="true">
    <path d="M867 766 L 900 766" stroke="rgba(201,195,245,0.7)" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
    <circle cx="865" cy="766" r="3" fill="#c9c3f5"/>
  </svg>
  <div class="rec-card">
    <div class="zoom"></div>
    <span>REC stays in the<br>page corner</span>
  </div>

  <script>
    // The quote is what the recording's spec heard, sentence 3 without its [a] marker.
    fetch("spec-example.md")
      .then((r) => (r.ok ? r.text() : Promise.reject(r.status)))
      .then((md) => {
        const block = md.split("## Request 3")[1] ?? "";
        const line = block.split("\n").find((l) => l.startsWith("> "));
        if (line) document.getElementById("quote").textContent = line.slice(2).replace(/\s*\[[a-z]\]/g, "");
      })
      .catch(() => {});
  </script>
</body>
</html>
