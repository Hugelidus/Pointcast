<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pointcast store screenshot 3: the spec</title>
<link rel="stylesheet" href="store.css">
<style>
  .window {
    position: absolute;
    left: 40px;
    top: 172px;
    width: 1200px;
    height: 612px;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(9, 7, 28, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  }
  .window .bar {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 40px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    font-size: 13px;
    font-weight: 600;
    color: var(--soft);
  }
  .window .dots { display: flex; gap: 7px; }
  .window .dots i { width: 11px; height: 11px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
  .window .bar .file { font-family: "JetBrains Mono", Consolas, monospace; color: #fff; font-weight: 500; }
  .window .bar .trim { margin-left: auto; color: var(--muted); font-weight: 500; }

  .spec {
    padding: 16px 26px;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 14px;
    line-height: 20px;
    color: #e9e6ff;
  }
  .spec .line { white-space: pre-wrap; }
  .spec .gap { height: 6px; }
  .spec .gap.big { height: 14px; }
  .spec .h { color: #fff; font-weight: 600; }
  .spec .q { color: var(--soft); }
  .spec .mark { color: #fff; font-weight: 600; background: rgba(236, 72, 153, 0.28); border-radius: 4px; }
  .spec .el { color: #fff; }
  .spec .sub { padding-left: 4ch; text-indent: -4ch; }
  .spec .sub.wraps { padding-left: 14ch; text-indent: -14ch; }
  .spec .k { background: linear-gradient(90deg, #a78bfa, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; }
  .spec .p { color: var(--muted); }
  .spec .c { color: #ffd6ec; }
  .spec .tick { color: #6f69a8; }
  /* The line to edit: where the element's text or data is written. */
  .spec .hot { background: linear-gradient(90deg, rgba(124, 58, 237, 0.22), rgba(236, 72, 153, 0.12) 70%, transparent); border-radius: 6px; box-shadow: inset 3px 0 0 #ec4899; }
</style>
</head>
<body>
  <div class="header">
    <span class="step">3 · Paste</span>
    <h1 class="headline">Each element <em>leads with its code</em></h1>
    <p class="subline">One request per sentence you said, with the file and line behind each element you pointed at.</p>
  </div>
  <!-- LOGO: scripts/icon/pointcast.svg -->
  <div class="brand"><img src="../../../../scripts/icon/pointcast.svg" alt=""><span>Pointcast</span></div>

  <div class="window">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <span class="file">session.md</span><span>copied to your clipboard · real recording on examples/react-dashboard</span>
      <span class="trim">find: · in: · styles: lines not shown</span>
    </div>
    <div class="spec" id="spec"></div>
  </div>

  <script>
    // spec-example.md is the spec the extension copied (session.md). Shown from "## Request 1" to
    // the appendix, without the find:/in:/styles: lines; every other line exactly as written.
    const escape = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const codeSpans = (s) =>
      escape(s).replace(/`([^`]*)`/g, '<span class="tick">`</span><span class="c">$1</span><span class="tick">`</span>');
    const LABEL = /^(  - )(used at:|defined in:|text at:|data at:|within:|on screen:)(.*)$/;

    function render(md) {
      const all = md.replace(/\r/g, "").split("\n");
      const from = all.findIndex((l) => l.startsWith("## Request 1"));
      const to = all.findIndex((l) => l.startsWith("## Appendix"));
      const lines = all.slice(from, to).filter((l) => !/^  - (find|in|styles):/.test(l));
      while (lines.at(-1) === "") lines.pop();
      const html = [];
      lines.forEach((line, i) => {
        if (line === "") {
          html.push(`<div class="gap${lines[i + 1]?.startsWith("## ") ? " big" : ""}"></div>`);
        } else if (line.startsWith("## ")) {
          html.push(`<div class="line h">${escape(line)}</div>`);
        } else if (line.startsWith("> ")) {
          html.push(`<div class="line q">${escape(line).replace(/\[([a-z])\]/g, '<span class="mark">[$1]</span>')}</div>`);
        } else if (LABEL.test(line)) {
          const [, dash, label, rest] = line.match(LABEL);
          const key = /^(used at|defined in|text at|data at):$/.test(label);
          const hot = /^(text at|data at):$/.test(label);
          html.push(
            `<div class="line sub${line.length > 130 ? " wraps" : ""}${hot ? " hot" : ""}">${dash}<span class="${key ? "k" : "p"}">${label}</span>${codeSpans(rest)}</div>`,
          );
        } else {
          html.push(`<div class="line el">${codeSpans(line)}</div>`);
        }
      });
      document.getElementById("spec").innerHTML = html.join("");
    }

    fetch("spec-example.md")
      .then((r) => (r.ok ? r.text() : Promise.reject(new Error(`spec-example.md: ${r.status}`))))
      .then(render)
      .catch((e) => (document.getElementById("spec").textContent = `Serve this folder over HTTP to see the spec (render.mjs does): ${e.message}`));
  </script>
</body>
</html>
